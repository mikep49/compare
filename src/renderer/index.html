<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Word files shown as documents bring their images and fonts as data URLs. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self' data:" />
    <title>Compare</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <svg hidden>
      <symbol id="i-compare" viewBox="0 0 24 24">
        <rect x="3" y="4" width="7.5" height="16" rx="2" />
        <rect x="13.5" y="4" width="7.5" height="16" rx="2" />
      </symbol>
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="M21.17 6.81a2.82 2.82 0 0 0-3.98-3.98L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z" />
        <path d="m15 5 4 4" />
      </symbol>
      <symbol id="i-swap" viewBox="0 0 24 24">
        <path d="M8 3 4 7l4 4" />
        <path d="M4 7h16" />
        <path d="m16 21 4-4-4-4" />
        <path d="M20 17H4" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z" />
      </symbol>
      <symbol id="i-oled" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" fill="currentColor" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24">
        <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z" />
      </symbol>
      <symbol id="i-file" viewBox="0 0 24 24">
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z" />
        <path d="M14 2v4a2 2 0 0 0 2 2h4" />
        <path d="M16 13H8M16 17H8M10 9H8" />
      </symbol>
      <symbol id="i-table" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <path d="M3 9h18M3 15h18M9 9v12M15 9v12" />
      </symbol>
      <symbol id="i-files" viewBox="0 0 24 24">
        <path d="M20 7h-3a2 2 0 0 1-2-2V2" />
        <path d="M9 18a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7l4 4v10a2 2 0 0 1-2 2z" />
        <path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8" />
      </symbol>
      <symbol id="i-sidebar" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <path d="M9 3v18" />
      </symbol>
      <symbol id="i-up" viewBox="0 0 24 24">
        <path d="m18 15-6-6-6 6" />
      </symbol>
      <symbol id="i-down" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9.5" />
        <path d="m8.5 12.5 2.5 2.5 4.5-5" />
      </symbol>
      <symbol id="i-cross" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9.5" />
        <path d="m9 9 6 6M15 9l-6 6" />
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9.5" />
        <path d="M12 16.5v-5M12 7.5h.01" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.6-3.6" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 3v12" />
        <path d="m7 10 5 5 5-5" />
        <path d="M5 21h14" />
      </symbol>
      <symbol id="i-update" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9.5" />
        <path d="M12 16.5v-9M8 11l4-4 4 4" />
      </symbol>
      <symbol id="i-restart" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="13" height="13" rx="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12" />
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9.5" />
        <path d="M12 7.5v5M12 16.5h.01" />
      </symbol>
      <symbol id="i-lines" viewBox="0 0 24 24">
        <path d="M4 6h16M4 10h16M4 14h10M4 18h13" />
      </symbol>
      <symbol id="i-page" viewBox="0 0 24 24">
        <rect x="5" y="2.5" width="14" height="19" rx="2" />
        <path d="M9 7.5h6M9 11h6M9 14.5h3.5" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M5 12h14M12 5v14" />
      </symbol>
      <symbol id="i-minus" viewBox="0 0 24 24">
        <path d="M5 12h14" />
      </symbol>
      <symbol id="i-rows" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M3 9.5h18M3 14.5h18M12 4v16" />
      </symbol>
      <symbol id="i-code" viewBox="0 0 24 24">
        <path d="m16 18 6-6-6-6" />
        <path d="m8 6-6 6 6 6" />
      </symbol>
      <symbol id="i-unified" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="2" />
        <path d="M8 9h8M8 12h8M8 15h5" />
      </symbol>
      <symbol id="i-fold-up" viewBox="0 0 24 24">
        <path d="M12 20V10" />
        <path d="m7 15 5-5 5 5" />
        <path d="M5 4h14" />
      </symbol>
      <symbol id="i-fold-down" viewBox="0 0 24 24">
        <path d="M12 4v10" />
        <path d="m7 9 5 5 5-5" />
        <path d="M5 20h14" />
      </symbol>
      <symbol id="i-unfold" viewBox="0 0 24 24">
        <path d="M12 22v-6M12 8V2" />
        <path d="M4 12H2M10 12H8M16 12h-2M22 12h-2" />
        <path d="m15 19-3 3-3-3" />
        <path d="m15 5-3-3-3 3" />
      </symbol>
      <symbol id="i-fold" viewBox="0 0 24 24">
        <path d="M12 22v-6M12 8V2" />
        <path d="M4 12H2M10 12H8M16 12h-2M22 12h-2" />
        <path d="m15 19-3-3-3 3" />
        <path d="m15 5-3 3-3-3" />
      </symbol>
      <symbol id="i-no-eol" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9.5" />
        <path d="M8 12h8" />
      </symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
      </symbol>
    </svg>

    <nav id="sidebar" class="sidebar" aria-label="Kind of comparison">
      <div class="sidebar-head">
        <button id="sidebar-toggle" class="btn ghost icon-btn" aria-controls="sidebar">
          <svg class="icon" aria-hidden="true"><use href="#i-sidebar" /></svg>
        </button>
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <rect class="logo-back" x="2.5" y="4" width="8.5" height="16" rx="2.5" />
          <rect class="logo-front" x="13" y="4" width="8.5" height="16" rx="2.5" />
        </svg>
      </div>
      <button class="sidebar-item" data-kind="docs" title="Documents: text, Word and PDF (Ctrl+1)">
        <svg class="icon" aria-hidden="true"><use href="#i-file" /></svg>
        <span>Documents</span>
      </button>
      <button class="sidebar-item" data-kind="sheets" title="Spreadsheets: Excel, OpenDocument and CSV (Ctrl+2)">
        <svg class="icon" aria-hidden="true"><use href="#i-table" /></svg>
        <span>Spreadsheets</span>
      </button>
      <button class="sidebar-item" data-kind="code" title="Code: source code, compared as GitHub shows changes (Ctrl+3)">
        <svg class="icon" aria-hidden="true"><use href="#i-code" /></svg>
        <span>Code</span>
      </button>
      <button class="sidebar-item" data-kind="files" title="Files: any two files, checked by their SHA-256 checksums (Ctrl+4)">
        <svg class="icon" aria-hidden="true"><use href="#i-files" /></svg>
        <span>Files</span>
      </button>
      <!-- Shown when a newer version is out; app.js names it. -->
      <button id="update-btn" class="update-btn" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-update" /></svg>
        <span></span>
      </button>
    </nav>

    <header class="topbar">
      <button id="compare-btn" class="btn primary" title="Ctrl+Enter">
        <svg class="icon" aria-hidden="true"><use id="compare-icon" href="#i-compare" /></svg>
        <span id="compare-label">Compare</span>
      </button>
      <button id="swap-btn" class="btn icon-btn" title="Swap sides" aria-label="Swap sides">
        <svg class="icon" aria-hidden="true"><use href="#i-swap" /></svg>
      </button>
      <button id="find-btn" class="btn icon-btn" title="Find (Ctrl+F)" aria-label="Find" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
      </button>
      <button id="export-btn" class="btn icon-btn" title="Export (Ctrl+S)" aria-label="Export" popovertarget="export-menu" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-download" /></svg>
      </button>
      <div id="export-menu" class="menu" popover>
        <button data-format="html" data-kinds="docs sheets code">
          <strong>HTML report</strong><span>Both sides with the changes marked, to read or print</span>
        </button>
        <button data-format="patch" data-kinds="docs code">
          <strong>Patch file</strong><span>The changes as a unified diff, for git and other tools</span>
        </button>
        <button data-format="csv" data-kinds="sheets">
          <strong>List of changes (CSV)</strong><span>Every changed cell, row and column, to open in Excel</span>
        </button>
      </div>

      <!-- Text | Document for documents, Table | Sheet for spreadsheets, Split |
           Unified for code; app.js names the buttons. -->
      <div id="view-switch" class="segmented" role="radiogroup" aria-label="View" hidden>
        <button role="radio" data-view="plain">
          <svg class="icon" aria-hidden="true"><use href="#i-lines" /></svg><span></span>
        </button>
        <button role="radio" data-view="look">
          <svg class="icon" aria-hidden="true"><use href="#i-page" /></svg><span></span>
        </button>
      </div>

      <div class="switches">
        <label class="switch" title="Ignore case"><input type="checkbox" id="opt-case" /><span>Ignore case</span></label>
        <label class="switch" title="Ignore whitespace"><input type="checkbox" id="opt-space" /><span>Ignore whitespace</span></label>
        <label class="switch" id="opt-only-switch" title="Differences only"><input type="checkbox" id="opt-only" /><span>Differences only</span></label>
      </div>

      <span class="spacer"></span>

      <div id="theme-switch" class="segmented" role="radiogroup" aria-label="Theme">
        <button role="radio" data-theme="light" title="Light">
          <svg class="icon" aria-hidden="true"><use href="#i-sun" /></svg><span>Light</span>
        </button>
        <button role="radio" data-theme="dark" title="Dark">
          <svg class="icon" aria-hidden="true"><use href="#i-moon" /></svg><span>Dark</span>
        </button>
        <button role="radio" data-theme="oled" title="OLED black">
          <svg class="icon" aria-hidden="true"><use href="#i-oled" /></svg><span>OLED</span>
        </button>
      </div>
    </header>

    <!-- One workspace per kind of comparison; app.js makes a copy for each. -->
    <template id="workspace">
      <section class="sheet" hidden>
        <div class="pane-heads">
        <div class="pane-head" data-side="left">
          <span class="pane-title">Original</span>
          <span class="pane-name"></span>
          <button class="btn ghost icon-btn info-btn" title="File details" aria-label="File details" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-info" /></svg>
          </button>
          <div class="details" popover></div>
          <span class="spacer"></span>
          <button class="btn ghost open-btn">
            <svg class="icon" aria-hidden="true"><use href="#i-folder" /></svg>Open file
          </button>
          <button class="btn ghost clear-btn">Clear</button>
          <input type="file" hidden />
        </div>
        <div class="pane-head" data-side="right">
          <span class="pane-title">Changed</span>
          <span class="pane-name"></span>
          <button class="btn ghost icon-btn info-btn" title="File details" aria-label="File details" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-info" /></svg>
          </button>
          <div class="details" popover></div>
          <span class="spacer"></span>
          <button class="btn ghost open-btn">
            <svg class="icon" aria-hidden="true"><use href="#i-folder" /></svg>Open file
          </button>
          <button class="btn ghost clear-btn">Clear</button>
          <input type="file" hidden />
        </div>
        </div>

        <div class="sheet-body">
          <div class="edit-view">
          <div class="pane-body" data-side="left">
            <textarea spellcheck="false" placeholder=" "></textarea>
            <div class="empty-hint">
              <svg class="icon" aria-hidden="true"><use /></svg>
              <strong></strong>
              <span></span>
            </div>
            <div class="pane-loading" role="status" hidden>
              <span class="spinner"></span>
              <span class="loading-text"></span>
            </div>
          </div>
          <div class="pane-body" data-side="right">
            <textarea spellcheck="false" placeholder=" "></textarea>
            <div class="empty-hint">
              <svg class="icon" aria-hidden="true"><use /></svg>
              <strong></strong>
              <span></span>
            </div>
            <div class="pane-loading" role="status" hidden>
              <span class="spinner"></span>
              <span class="loading-text"></span>
            </div>
          </div>
          </div>

          <div class="sheet-tabs" role="tablist" aria-label="Sheets" hidden></div>
          <div class="diff-note" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-check" /></svg>
            <span></span>
          </div>
          <div class="diff-view" hidden></div>
          <div class="diff-busy" role="status" hidden>
            <span class="spinner"></span>
            <span>Comparing…</span>
          </div>

          <div class="code-view" hidden>
            <div class="code-head">
              <button class="btn ghost icon-btn code-expand">
                <svg class="icon" aria-hidden="true"><use href="#i-unfold" /></svg>
              </button>
              <span class="code-name"></span>
              <span class="code-stat"></span>
              <span class="spacer"></span>
              <span class="code-language"></span>
            </div>
            <div class="code-scroll"><div class="code-diff"></div></div>
          </div>

          <div class="doc-view" hidden>
          <div class="doc-pane" data-side="left">
            <div class="doc-scroll"><div class="doc-content"><div class="doc-pages"></div><div class="doc-veil"></div><div class="doc-marks"></div></div></div>
            <div class="doc-status" role="status" hidden>
              <span class="spinner"></span>
              <svg class="icon" aria-hidden="true"><use href="#i-alert" /></svg>
              <span class="doc-status-text"></span>
            </div>
          </div>
          <div class="doc-pane" data-side="right">
            <div class="doc-scroll"><div class="doc-content"><div class="doc-pages"></div><div class="doc-veil"></div><div class="doc-marks"></div></div></div>
            <div class="doc-status" role="status" hidden>
              <span class="spinner"></span>
              <svg class="icon" aria-hidden="true"><use href="#i-alert" /></svg>
              <span class="doc-status-text"></span>
            </div>
          </div>
          <div class="doc-tools">
            <button class="btn ghost icon-btn doc-zoom-out" title="Zoom out (Ctrl+mouse wheel)" aria-label="Zoom out">
              <svg class="icon" aria-hidden="true"><use href="#i-minus" /></svg>
            </button>
            <button class="btn ghost doc-zoom-level" aria-label="Zoom; click to fit the pages to the width"></button>
            <button class="btn ghost icon-btn doc-zoom-in" title="Zoom in (Ctrl+mouse wheel)" aria-label="Zoom in">
              <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
            </button>
            <span class="navigator-divider"></span>
            <button class="btn ghost icon-btn doc-sync" aria-label="Scroll both sides together">
              <svg class="icon" aria-hidden="true"><use href="#i-link" /></svg>
            </button>
            <button class="btn ghost icon-btn doc-paper" title="Dark pages" aria-label="Dark pages">
              <svg class="icon" aria-hidden="true"><use href="#i-moon" /></svg>
            </button>
          </div>
          </div>

          <div class="files-view" hidden>
          <div class="file-pane" data-side="left">
            <div class="file-card" hidden></div>
            <div class="verify" hidden>
              <label>
                <span>Check against a checksum</span>
                <input type="text" spellcheck="false" autocomplete="off" placeholder="Paste an MD5, SHA-1, SHA-256 or SHA-512 checksum" />
              </label>
              <div class="verify-result" role="status" hidden>
                <svg class="icon" aria-hidden="true"><use /></svg>
                <span></span>
              </div>
            </div>
            <div class="empty-hint">
              <svg class="icon" aria-hidden="true"><use href="#i-files" /></svg>
              <strong></strong>
              <span></span>
            </div>
          </div>
          <div class="file-pane" data-side="right">
            <div class="file-card" hidden></div>
            <div class="verify" hidden>
              <label>
                <span>Check against a checksum</span>
                <input type="text" spellcheck="false" autocomplete="off" placeholder="Paste an MD5, SHA-1, SHA-256 or SHA-512 checksum" />
              </label>
              <div class="verify-result" role="status" hidden>
                <svg class="icon" aria-hidden="true"><use /></svg>
                <span></span>
              </div>
            </div>
            <div class="empty-hint">
              <svg class="icon" aria-hidden="true"><use href="#i-files" /></svg>
              <strong></strong>
              <span></span>
            </div>
          </div>
          </div>

          <div class="table-view" hidden>
            <div class="grid-head">
            <div class="grid-half l">
              <div class="grid-num"></div>
              <div class="grid-cells"><div class="grid-strip"></div></div>
            </div>
            <div class="grid-half r">
              <div class="grid-num"></div>
              <div class="grid-cells"><div class="grid-strip"></div></div>
            </div>
            </div>
            <div class="grid-scroll">
              <div class="grid-rows"><div class="grid-window"></div></div>
            </div>
            <div class="grid-bars" hidden>
              <div class="grid-bar"><div></div></div>
              <div class="grid-bar"><div></div></div>
            </div>
          </div>

          <div class="navigator" hidden>
            <div class="stats"></div>
            <span class="navigator-divider"></span>
            <button class="btn ghost icon-btn prev-btn" title="Previous difference (Shift+F8)" aria-label="Previous difference">
              <svg class="icon" aria-hidden="true"><use href="#i-up" /></svg>
            </button>
            <span class="position"></span>
            <button class="btn ghost icon-btn next-btn" title="Next difference (F8)" aria-label="Next difference">
              <svg class="icon" aria-hidden="true"><use href="#i-down" /></svg>
            </button>
          </div>
        </div>
      </section>
    </template>

    <div id="find-bar" class="find-bar" role="search" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
      <input id="find-input" type="text" spellcheck="false" autocomplete="off" placeholder="Find" aria-label="Find" />
      <span id="find-count" class="find-count" aria-live="polite"></span>
      <button id="find-prev" class="btn ghost icon-btn" title="Previous match (Shift+Enter)" aria-label="Previous match">
        <svg class="icon" aria-hidden="true"><use href="#i-up" /></svg>
      </button>
      <button id="find-next" class="btn ghost icon-btn" title="Next match (Enter)" aria-label="Next match">
        <svg class="icon" aria-hidden="true"><use href="#i-down" /></svg>
      </button>
      <button id="find-close" class="btn ghost icon-btn" title="Close (Esc)" aria-label="Close find">
        <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
      </button>
    </div>

    <div id="message" class="toast" role="alert" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-alert" /></svg>
      <span></span>
      <button id="message-action" class="btn ghost" hidden></button>
    </div>

    <script src="../../node_modules/diff/dist/diff.min.js"></script>
    <script src="diff-engine.js"></script>
    <script src="code-diff.js"></script>
    <script src="code-html.js"></script>
    <script src="../code-languages.js"></script>
    <script src="../table-text.js"></script>
    <script src="table-diff.js"></script>
    <script src="table-view.js"></script>
    <script src="report.js"></script>
    <script src="find-text.js"></script>
    <script src="code-view.js"></script>
    <script src="doc-align.js"></script>
    <script src="doc-sources.js"></script>
    <script src="doc-view.js"></script>
    <script src="sheet-view.js"></script>
    <script src="diff-client.js"></script>
    <script src="app.js"></script>
  </body>
</html>
