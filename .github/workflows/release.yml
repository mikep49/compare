# Push a tag such as v1.1.0 (matching "version" in package.json) to build the
# installer and the portable exe and publish them as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Compare-Setup-*.exe
            dist/Compare-Portable-*.exe
          generate_release_notes: true
